# Workspace root — not itself a published package. Members live in
# packages/* (qa-pack, evals, metrics).

[project]
name = "devin-assure"
version = "0.0.0"
description = "Monorepo workspace for the devin-assure product: qa-pack, evals, metrics."
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
