name: devin-evals regression
description: Replay the eval corpus against a sessions.db and fail on regressions.
author: Icaro0310
branding:
  icon: check-circle
  color: blue
inputs:
  evals-dir:
    description: Directory of eval case JSONs
    required: true
  sessions-db:
    description: Path to sessions.db
    required: true
  packs-dir:
    description: Optional packs dir
    required: false
    default: ""
  python-version:
    description: Python used to install the harness
    required: false
    default: "3.12"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install devin-evals
      shell: bash
      run: pip install devin-evals
    - name: Run evals
      shell: bash
      run: |
        args="run --evals ${{ inputs.evals-dir }} --sessions-db ${{ inputs.sessions-db }}"
        [ -n "${{ inputs.packs-dir }}" ] && args="$args --packs-dir ${{ inputs.packs-dir }}"
        devin-evals $args
