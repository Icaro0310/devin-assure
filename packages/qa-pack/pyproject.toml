[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-qa-pack"
version = "0.2.1"
description = "QA audit for agent sessions: verifies deliverable claims (tests, commits, files, pushes) against recorded tool-call ground truth across Devin CLI, Copilot CLI, Codex CLI and VS Code chat stores."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = [
  "devin-internals-spec>=0.3.0,<0.4.0",
  "devin-install-scheduler>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6"]
mcp = ["mcp>=1.2"]

[project.scripts]
devin-qa-pack = "devin_qa_pack.cli:main"
devin-qa-pack-mcp = "devin_qa_pack.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
