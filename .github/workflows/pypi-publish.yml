name: publish

# Publishes the package matching the pushed tag (or the selected dispatch
# input) to PyPI via Trusted Publishing (OIDC). The upload job must live in
# this file: PyPI matches job_workflow_ref against this workflow's path.

on:
  push:
    tags: ['qa-pack-v*','evals-v*','metrics-v*']
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - qa-pack
          - evals
          - metrics

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Resolve package directory
        id: pkg
        env:
          REF: ${{ github.ref_name }}
          SEL: ${{ inputs.package }}
        run: |
          base="${SEL:-${REF%%-v*}}"
          case "$base" in
              qa-pack)
                echo "dir=packages/qa-pack" >> "$GITHUB_OUTPUT"
                echo "mod=devin_qa_pack" >> "$GITHUB_OUTPUT" ;;
              evals)
                echo "dir=packages/evals" >> "$GITHUB_OUTPUT"
                echo "mod=devin_evals" >> "$GITHUB_OUTPUT" ;;
              metrics)
                echo "dir=packages/metrics" >> "$GITHUB_OUTPUT"
                echo "mod=devin_metrics" >> "$GITHUB_OUTPUT" ;;
            *) echo "unknown package: $base" >&2; exit 1 ;;
          esac
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      # A released wheel once self-reported a stale __version__; install
      # the just-built wheel into an isolated target and assert it
      # matches pyproject before anything is uploaded.
      - name: Verify wheel self-reports pyproject version
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          PKG: ${{ steps.pkg.outputs.mod }}
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          test -n "$ver"
          pip install --no-cache-dir --target /tmp/verchk dist/*.whl
          VER="$ver" python -c "import importlib, os, sys; sys.path.insert(0, '/tmp/verchk'); m = importlib.import_module('$PKG'); assert getattr(m, '__version__', None) == os.environ['VER'], f'wheel __version__ {getattr(m, \"__version__\", None)} != pyproject {os.environ[\"VER\"]}'"
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: ${{ steps.pkg.outputs.dir }}/dist
          skip-existing: true
