name: ci

# Secrets scan runs on every change; per-package test jobs are gated on
# the `changes` diff (job-level path gating, replacing the path-filtered
# test-*.yml PR triggers). The always-on `ci-gate` job aggregates every
# result into the single required check, so a failing or cancelled job
# blocks merges even though path-gated suites legitimately skip.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      evals: ${{ steps.f.outputs.evals }}
      metrics: ${{ steps.f.outputs.metrics }}
      qa_pack: ${{ steps.f.outputs.qa_pack }}
      qa_pack_vscode: ${{ steps.f.outputs.qa_pack_vscode }}
      evals_action: ${{ steps.f.outputs.evals_action }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: f
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git rev-parse --verify "$base" >/dev/null 2>&1; then
            base="HEAD~1"
          fi
          diff_ok=0
          git diff --name-only "$base" HEAD >/dev/null 2>&1 && diff_ok=1
          # diff not computable -> run every suite (safe default)
          for spec in \
            'evals:packages/evals/** .github/workflows/test-evals.yml' \
            'metrics:packages/metrics/** .github/workflows/test-metrics.yml' \
            'qa_pack:packages/qa-pack/** action.yml .github/workflows/test-qa-pack.yml' \
            'qa_pack_vscode:packages/qa-pack/adapters/vscode/** packages/qa-pack/src/** packages/qa-pack/pyproject.toml .github/workflows/test-qa-pack-vscode.yml' \
            'evals_action:packages/evals/** .github/workflows/evals-action.yml' \
          ; do
            pkg="${spec%%:*}"; paths="${spec#*:}"
            if [ "$diff_ok" = "0" ] || git diff --name-only "$base" HEAD -- $paths | grep -q .; then
              echo "$pkg=true" >> "$GITHUB_OUTPUT"
            else
              echo "$pkg=false" >> "$GITHUB_OUTPUT"
            fi
          done
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check .
  secrets-scan:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/secrets-scan.yml@v1
  adapters-check:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/adapters-check.yml@v1
  config-restricted-check:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/config-restricted-check.yml@v1
  test-evals:
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1
    with:
      package-dir: packages/evals
  test-metrics:
    needs: changes
    if: needs.changes.outputs.metrics == 'true'
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1
    with:
      package-dir: packages/metrics
  test-qa-pack:
    needs: changes
    if: needs.changes.outputs.qa_pack == 'true'
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1
    with:
      package-dir: packages/qa-pack
  test-qa-pack-vscode:
    needs: changes
    if: needs.changes.outputs.qa_pack_vscode == 'true'
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/adapter-test.yml@v1
    with:
      package-dir: packages/qa-pack
      adapter-dir: packages/qa-pack/adapters/vscode
      test-command: node --test
      node-version: "22"
      skip-install: true
  evals-action:
    needs: changes
    if: needs.changes.outputs.evals_action == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Prepare tampered corpus fixture
        run: |
          cp -r packages/evals/corpus .smoke-tampered
          python3 - <<'PY'
          import json
          # expected_status lives in each evals/*.json case file, not the
          # manifest — flip golden-d03's pass → fail to force a MISMATCH
          f = ".smoke-tampered/evals/golden-d03-verified-claim.json"
          c = json.load(open(f))
          assert c["expected_status"] == "pass"
          c["expected_status"] = "fail"
          json.dump(c, open(f, "w"), indent=2)
          PY

      - name: real corpus → expect pass
        id: healthy
        uses: Icaro0310/devin-evals-action@v1
        with:
          corpus: packages/evals/corpus
          # Corpus and tool are versioned together in this repo — a new
          # grader landing in the same PR as its rubric use can never be
          # verified by a released devin-evals.
          version: "./packages/evals"

      - name: assert real corpus passed
        run: |
          test "${{ steps.healthy.outcome }}" = "success"
          test "${{ steps.healthy.outputs.ok }}" = "true"
          echo "golden corpus verified clean (${{ steps.healthy.outputs.matched }} matched)"

      - name: tampered corpus → expect regression failure
        id: tampered
        uses: Icaro0310/devin-evals-action@v1
        continue-on-error: true
        with:
          corpus: .smoke-tampered
          version: "./packages/evals"

      - name: assert regression classification fired
        run: |
          test "${{ steps.tampered.outcome }}" = "failure"
          test "${{ steps.tampered.outputs.ok }}" = "false"
          mismatches="${{ steps.tampered.outputs.mismatched }}"
          test -n "$mismatches" && test "$mismatches" -ge 1
          echo "tampered corpus failed as regression ($mismatches mismatch(es))"

      - name: missing corpus → expect precondition failure
        id: missing
        uses: Icaro0310/devin-evals-action@v1
        continue-on-error: true
        with:
          corpus: /tmp/no-such-corpus

      - name: assert precondition classification (no mismatches)
        run: |
          test "${{ steps.missing.outcome }}" = "failure"
          test -z "${{ steps.missing.outputs.mismatched }}"
          echo "missing corpus failed as precondition, not regression"
  ci-gate:
    if: always()
    needs: [changes, lint, secrets-scan, adapters-check, config-restricted-check, test-evals, test-metrics, test-qa-pack, test-qa-pack-vscode, evals-action]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] not in ("success", "skipped")}
          for k, v in needs.items():
              print(f"{k}: {v['result']}")
          if bad:
              print(f"ci-gate FAIL: {bad}", file=sys.stderr)
              sys.exit(1)
          print("ci-gate PASS")
          PY
