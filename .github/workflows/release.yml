name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and test
        run: |
          python -m pip install -e ".[dev]" build
          python -m pytest -q
          python -m build

      - name: Generate SBOM
        run: pipx run --spec cyclonedx-bom cyclonedx-py environment
          "$(which python)" --pyproject pyproject.toml --mc-type library
          -o sbom.cdx.json

      - name: Sign artifacts
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG_PRIVATE_KEY not configured; skipping signing"
            exit 0
          fi
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          KEYID=$(printf '%s' "$GPG_PRIVATE_KEY" | \
            gpg --batch --import --show-keys --with-colons | \
            awk -F: '/^fpr/{print $10; exit}')
          for f in dist/* sbom.cdx.json; do
            gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --local-user "$KEYID" --armor --detach-sign "$f"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" dist/* sbom.cdx.json* --verify-tag --generate-notes
