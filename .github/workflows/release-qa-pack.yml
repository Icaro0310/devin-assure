name: release-qa-pack

# Extension + wheel release for the qa-pack package — this package ships
# both artifacts under one version (pyproject == adapters/vscode ==
# src/devin_qa_pack/__init__.py == .devin-plugin/plugin.json).
# Tag `qa-pack-vX.Y.Z` attaches the packaged .vsix to the GitHub release
# and fans out to the reusable release.yml@v1: detect finds the wheel
# (verify gate runs; the PyPI upload itself stays in pypi-publish.yml —
# its job_workflow_ref binding skips on a cross-repo reusable) →
# vscode-ext lint → vsce → VS Code Marketplace (Entra OIDC) → Open VSX
# (OVSX_PAT).
#
# Marketplace: needs a federated credential on the
# devin-vscode-marketplace app registration with subject
# repo:Icaro0310/devin-assure:environment:release — the Azure login step
# warns/skips until it exists (the AZURE_* repo vars are already set).

on:
  push:
    tags:
      - "qa-pack-v*"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # dispatch pypi-publish.yml after the release — see below

jobs:
  # Shared prerequisite: a mistagged `qa-pack-vX.Y.Z` must fail HERE,
  # before either the release job or the fan-out publishes anything.
  # `release` and `fanout` both declare `needs: validate`, so the
  # extension can never ship under a label that disagrees with the
  # manifests.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `<pkg>-vX.Y.Z` convention — the manifests and pyproject must
      # agree (lockstep is also enforced by the reusable lint on the
      # fanout leg). Strip the `<pkg>-v` prefix on the LAST '-v' — the
      # rsplit convention shared with the reusable's tag gate.
      - name: Check tag matches manifest versions
        if: github.ref_type == 'tag'
        run: |
          want="${GITHUB_REF_NAME##*-v}"
          got_ext=$(python3 -c "import json; print(json.load(open('packages/qa-pack/adapters/vscode/package.json'))['version'])")
          got_wheel=$(python3 -c "import tomllib; print(tomllib.load(open('packages/qa-pack/pyproject.toml','rb'))['project']['version'])")
          got_init=$(python3 -c "import re; print(re.search(r'__version__\s*=\s*\"([^\"]+)\"', open('packages/qa-pack/src/devin_qa_pack/__init__.py').read()).group(1))")
          got_plugin=$(python3 -c "import json; print(json.load(open('packages/qa-pack/adapters/.devin-plugin/plugin.json'))['version'])")
          for got in "$got_ext" "$got_wheel" "$got_init" "$got_plugin"; do
            if [ "$want" != "$got" ]; then
              echo "::error::tag '$GITHUB_REF_NAME' ($want) vs package.json $got_ext / pyproject $got_wheel / __version__ $got_init / plugin.json $got_plugin"
              exit 1
            fi
          done

  release:
    needs: validate
    # GitHub release work stays tag-push-only — a dispatch (even against
    # an existing tag ref) proves nothing here, it only runs `validate`.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Build and package the extension
        working-directory: packages/qa-pack/adapters/vscode
        run: |
          # Plain-JS extension, no lockfile and no build script — the
          # conditional mirrors the reusable's install leg, and
          # --if-present keeps the build step a no-op.
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npm run build --if-present
          npx @vscode/vsce package   # → devin-qa-pack-<version>.vsix

      - name: Attach .vsix to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VSIX=$(ls packages/qa-pack/adapters/vscode/devin-qa-pack-*.vsix)
          # release.yml mints the GitHub release for the same tag with
          # the wheel + SBOM assets — poll for it and attach the vsix to
          # the existing release instead of racing `gh release create`.
          # No fallback create: a vsix-only release would make the wheel
          # job's own `gh release create` fail and strand its assets.
          for _ in $(seq 1 90); do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              gh release upload "$RELEASE_TAG" "$VSIX" --clobber
              exit 0
            fi
            sleep 10
          done
          echo "::error::no GitHub release for $RELEASE_TAG after 15 min — the release.yml wheel job did not mint one"
          exit 1

      # pypi-publish.yml already fires on the `qa-pack-v*` tag push —
      # this explicit dispatch covers re-runs of THIS workflow (a rerun
      # does not re-emit the tag push event) and is idempotent
      # end-to-end: the publish leg uploads with skip-existing.
      # continue-on-error: a dispatch failure must not fail `release`
      # and starve the fanout leg (Open VSX + Marketplace) — the tag
      # push already queued PyPI independently, so a failed re-dispatch
      # is a warning, not a release blocker.
      - name: Trigger PyPI publish workflow
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh workflow run pypi-publish.yml --ref "$RELEASE_TAG" -f package=qa-pack

  fanout:
    needs: [validate, release]
    # Publish legs only ever run on a real tag push after the GitHub
    # release succeeded — a workflow_dispatch must not publish to the
    # registries (the reusable's own tag gate is tag-only too).
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # Every scope the reusable requests must be granted here — a
    # missing scope fails the whole run at startup_failure.
    permissions:
      contents: read
      id-token: write   # Entra OIDC + cosign keyless
      packages: write   # docker leg scope
    uses: Icaro0310/devin-powerups/.github/workflows/release.yml@v1
    # Explicit mapping, not `inherit`: forwards only the Open VSX token.
    secrets:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    with:
      azure-marketplace-required: true
      package-dir: packages/qa-pack
      vscode-ext-dir: packages/qa-pack/adapters/vscode
      # Repo has a `pypi` environment — matches the Trusted Publisher
      # binding. The upload still belongs to pypi-publish.yml (the
      # reusable's cross-repo PyPI leg self-skips); the verify gate and
      # version-exists check run regardless.
      pypi-environment: pypi
