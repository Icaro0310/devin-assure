name: bootstrap-approve

# One-shot self-bootstrap: PRs that fix the pr-approve caller itself can't
# get approved by the broken base version (pull_request_target runs base).
# pull_request_review_comment executes the workflow FROM THE PR HEAD, so
# this file — present only on the fix branch — approves and arms merge.
# Dormant after merge: the `if` pins PR #135 which can never re-open.

on:
  pull_request_review_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: write
  statuses: read

jobs:
  approve:
    if: >-
      github.event.pull_request.number == 135 &&
      github.event.pull_request.state == 'open' &&
      contains(github.event.comment.body, 'bootstrap-approve')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: approve
        run: gh pr review 135 -R Icaro0310/devin-assure --approve --body "bootstrap via head-ref workflow"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: arm auto-merge
        run: gh pr merge 135 -R Icaro0310/devin-assure --squash --auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
