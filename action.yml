name: devin-qa-pack audit
description: >-
  Verify AI coding agent claims (diffs, test runs, commits, pushes) against
  the agent's own tool_call_state. Gate CI on evidence, not narrative.
author: Icaro0310
branding:
  icon: check-circle
  color: green
inputs:
  sessions-db:
    description: "Path to the agent sessions.db (default: auto-detect)"
    required: false
    default: ""
  session:
    description: Audit a single session ID instead of --all
    required: false
    default: ""
  limit:
    description: Max sessions to audit when using --all
    required: false
    default: "20"
  python-version:
    description: Python used to install the pack
    required: false
    default: "3.12"
  comment:
    description: >-
      Post the audit verdict as a PR comment via `gh pr comment`:
      "auto" (default) posts on pull_request events, "always" also tries
      on other events (resolving the open PR whose head is the pushed
      branch), "never"/"false" disables. Reporting only — a comment
      failure warns but never changes the gate outcome. Requires the
      caller job to grant `permissions: pull-requests: write`;
      composite actions cannot self-grant.
    required: false
    default: "auto"
  token:
    description: >-
      Token used for `gh pr comment` — defaults to the workflow's
      GITHUB_TOKEN and needs pull-requests: write to post.
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install devin-qa-pack
      shell: bash
      env:
        ACTION_SRC: ${{ github.action_path }}
      run: pip install "$ACTION_SRC/packages/qa-pack"
    - name: Run audit
      shell: bash
      env:
        SESSIONS_DB: ${{ inputs.sessions-db }}
        SESSION_ID: ${{ inputs.session }}
        LIMIT: ${{ inputs.limit }}
        COMMENT: ${{ inputs.comment }}
      run: |
        if [ -n "$SESSION_ID" ]; then
          args=(audit --session "$SESSION_ID")
        else
          args=(audit --all --limit "$LIMIT")
        fi
        [ -n "$SESSIONS_DB" ] && args+=(--sessions-db "$SESSIONS_DB")
        # GitHub expressions compare input strings case-insensitively
        # and bash does not — normalize so a mixed-case value gates
        # --out exactly the way the comment step's `if:` gates the post
        # (tr over ${var,,} keeps macOS bash 3.2 runners working).
        COMMENT="$(printf '%s' "${COMMENT:-}" | tr '[:upper:]' '[:lower:]')"
        # Persist the JSON payload for the PR-comment step ONLY when
        # that step can actually run (same condition as its `if:`): an
        # --out write failure exits 2, so requesting an artifact a
        # disabled comment leg would never read must not change a
        # passing audit's exit code.
        want_comment=false
        if [ -n "$COMMENT" ] && [ "$COMMENT" != "never" ] && [ "$COMMENT" != "false" ]; then
          if [ "$COMMENT" = "always" ] || [ "$COMMENT" = "true" ] || [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            want_comment=true
          fi
        fi
        if [ "$want_comment" = "true" ]; then
          # Unique per run attempt AND per step invocation (PID+RANDOM),
          # cleared before the audit runs — a retried job or a second
          # use of the action can never pick up a stale verdict left by
          # an earlier invocation whose audit failed before writing.
          QA_AUDIT_JSON="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/devin-qa-pack-audit-${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-0}-$$-${RANDOM}.json"
          rm -f "$QA_AUDIT_JSON"
          args+=(--out "$QA_AUDIT_JSON")
          # Hand the path to the comment step — exported BEFORE the
          # audit runs so a failing verdict (non-zero exit) still leaves
          # the marker for the always() reporting leg.
          if [ -n "${GITHUB_ENV:-}" ]; then
            echo "QA_AUDIT_JSON=$QA_AUDIT_JSON" >> "$GITHUB_ENV"
          fi
        fi
        devin-qa-pack "${args[@]}"
    - name: Comment verdict on PR
      # Reporting leg, not a gate — always() so a failing audit verdict
      # still gets posted, continue-on-error plus set +e/exit 0 so no
      # failure path here can change the check outcome. Needs
      # `permissions: pull-requests: write` on the caller job —
      # composite actions cannot self-grant.
      if: >-
        always() &&
        inputs.comment != 'never' &&
        inputs.comment != 'false' &&
        (inputs.comment == 'always' ||
         inputs.comment == 'true' ||
         github.event_name == 'pull_request')
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        set +e
        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::warning::no token for gh pr comment — pass the token input or grant the job pull-requests: write; skipping PR comment"
          exit 0
        fi
        if ! command -v gh >/dev/null 2>&1; then
          echo "::warning::gh CLI not on PATH — skipping PR comment"
          exit 0
        fi
        # The audit step exports QA_AUDIT_JSON (a unique per-invocation
        # path under RUNNER_TEMP). A missing or empty file means the
        # audit failed before it could write — warn and skip, never
        # repost a stale verdict and never fail the job.
        QA_AUDIT_JSON="${QA_AUDIT_JSON:-}"
        if [ -z "$QA_AUDIT_JSON" ] || [ ! -s "$QA_AUDIT_JSON" ]; then
          echo "::warning::no audit payload at ${QA_AUDIT_JSON:-<not exported>} — skipping PR comment"
          exit 0
        fi
        QA_AUDIT_BODY="$QA_AUDIT_JSON.comment.md"
        if [ -z "$PR_NUMBER" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
          # comment: always on a non-PR event — resolve the open PR for
          # the pushed branch, if one exists.
          PR_NUMBER="$(gh pr list -R "$GITHUB_REPOSITORY" --state open \
            --head "$GITHUB_REF_NAME" --json number \
            --jq '.[0].number // empty' 2>/dev/null)"
        fi
        if [ -z "$PR_NUMBER" ]; then
          echo "::warning::no pull request found for this event — skipping PR comment"
          exit 0
        fi
        QA_RUN_URL=""
        if [ -n "${GITHUB_RUN_ID:-}" ] && [ -n "${GITHUB_REPOSITORY:-}" ]; then
          QA_RUN_URL="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
        fi
        QA_RUN_URL="$QA_RUN_URL" python3 - "$QA_AUDIT_JSON" > "$QA_AUDIT_BODY" <<'PY'
        import json
        import os
        import sys

        # Windows runners default stdout to cp1252 — reconfigure so the
        # em-dashes/middle-dots below reach the file (and the gh call)
        # as UTF-8 instead of mojibake in the posted comment.
        sys.stdout.reconfigure(encoding="utf-8")
        payload = json.load(open(sys.argv[1], encoding="utf-8"))
        sessions = payload.get("sessions", [])
        order = {"PASS": 0, "UNVERIFIED": 1, "PARTIAL": 2}
        worst = max(
            (s.get("verdict", "UNVERIFIED") for s in sessions),
            key=order.get,
            default="UNVERIFIED",
        )
        # Aggregate only — session titles, claim names and the local db
        # path stay in the artifact on the runner: a public PR comment
        # must not leak filesystem paths or task detail.
        lines = [f"## devin-qa-pack audit — {worst}", ""]
        for s in sessions:
            counts = s.get("summary", {})
            # A backtick or newline in a session-store id would break
            # out of the inline code span and inject markdown into a
            # public PR comment — strip them so the id always renders
            # inside one code span on one line.
            sid = (
                str(s.get("session_id", "?"))
                .replace("`", "")
                .replace("\r", " ")
                .replace("\n", " ")
            )
            lines.append(
                f"- **{s.get('verdict', '?')}** `{sid}` — "
                f"{counts.get('verified', 0)} verified, "
                f"{counts.get('disputed', 0)} disputed, "
                f"{counts.get('unverifiable', 0)} unverifiable"
            )
        footer = (
            f"<sub>devin-qa-pack {payload.get('version', '?')} · "
            f"{len(sessions)} session(s) audited"
        )
        run_url = os.environ.get("QA_RUN_URL", "")
        if run_url:
            footer += f" · [workflow run]({run_url})"
        lines += ["", footer + "</sub>", "<!-- devin-qa-pack-audit -->"]
        sys.stdout.write("\n".join(lines) + "\n")
        PY
        if [ ! -s "$QA_AUDIT_BODY" ]; then
          echo "::warning::could not render the verdict comment body — skipping PR comment"
          exit 0
        fi
        # Re-runs update the previous verdict comment instead of
        # spamming new ones — look ours up by the marker tag across ALL
        # pages (--paginate + `jq -s 'add // []'` flattens the pages; a
        # PR can hold far more than 100 comments). Only bot-owned
        # comments qualify (.user.login): a marker pasted by a human
        # author is a forgery — never edit it, post a fresh comment.
        COMMENT_ID=""
        if command -v jq >/dev/null 2>&1; then
          # A caller-supplied `token` posts as ITS account, not a bot —
          # resolve the authenticated login so re-runs update our own
          # comment instead of stacking duplicates.
          COMMENTER="$(gh api user 2>/dev/null | jq -r '.login // empty' 2>/dev/null)"
          COMMENTS_JSON="$(gh api \
            "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            --paginate 2>/dev/null)"
          COMMENT_ID="$(printf '%s\n' "$COMMENTS_JSON" | jq -s --arg me "$COMMENTER" '
            (add // [])
            | [.[] | select(
                (.body | contains("<!-- devin-qa-pack-audit -->"))
                and (.user.login == "github-actions[bot]"
                     or .user.login == "devin-ai-integration[bot]"
                     or .user.login == "app/github-actions"
                     or ($me != "" and .user.login == $me)))]
            | last | (.id // empty)' 2>/dev/null)"
        else
          echo "::warning::jq not on PATH — cannot look up a previous verdict comment; posting a fresh one"
        fi
        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH \
            "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" \
            -f body="$(cat "$QA_AUDIT_BODY")" > /dev/null \
            || echo "::warning::could not update the verdict comment — audit verdict unaffected (job missing pull-requests: write?)"
        else
          gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" \
            --body-file "$QA_AUDIT_BODY" \
            || echo "::warning::could not post the verdict comment — audit verdict unaffected (job missing pull-requests: write?)"
        fi
        exit 0
